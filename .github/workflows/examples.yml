name: Validate published examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copyable-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse every payload and run each bash snippet with fake curl
        run: python3 -m unittest discover -s tests -v
